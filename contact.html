<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YSSE | Contact</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <img src="logo.png" alt="YSSE Logo" width="80">
        <h1>Contact YSSE</h1>
        <p>Get in Touch With Us</p>

        <nav>
            <ul>
                <li><a href="home.html">Home</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="events.html">Events</a></li>
                <li><a href="index.html">Notices</a></li>
                <li><a href="contact.html">Contact</a></li>            </ul>
        </nav>
    </header>

    <main>
        <section>
            <h2>Contact Information</h2>
            <p>Organization: Youth School for Social Entrepreneurs</p>
            <p>Website:
                <a href="https://ysseglobal.org/">
                    Official YSSE Website
                </a>
            </p>
        </section>

        <section>
            <h2>Send Us a Message</h2>

            <form>
                <p>
                    <label for="name">Your Name:</label><br>
                    <input type="text" id="name" name="name">
                </p>

                <p>
                    <label for="email">Your Email:</label><br>
                    <input type="email" id="email" name="email">
                </p>

                <p>
                    <label for="message">Your Message:</label><br>
                    <textarea id="message" name="message"
                        rows="5" cols="40"></textarea>
                </p>

                <button type="submit">Send Message</button>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 YSSE Notice Board</p>
    </footer>

</body>
</html>
